# DRAFT. Not certified. Values are proposals for the owner to confirm.
# Gross profit and net ordinary income use the `derived` metric type (D-021).
# Other income and expense, and so net income, are not yet modelled: the filter list has
# no other-income or other-expense account filters. See DECISIONS.md O-012.
dataset: pnl
version: 0.1.0
owner: finance.reporting
state: draft
grain: gl_posting
keys: [transaction_id, line_id, accounting_book]
sign: natural
as_of: posting_period
currency_basis: [subsidiary_base, consolidated]
consolidation:
  rate_type: per_account_type
  eliminations: include_elimination_subsidiary
  accounting_book: primary
inputs: [gl_posting, account, period, subsidiary, currency_rate, book]
freshness:
  batch: {target_minutes: 15}
integrity:
  deletes: key_set_sweep_nightly
  delete_latency_hours: 24
  tie_out:
    report: income_statement
    snapshot: common
    exclude_provisional: true
    tolerance: {basis: absolute_currency, value: 0.01}
metrics:
  - id: revenue
    type: additive
    measure: posted_amount
    filters: [posting_only, primary_book_only, income_accounts]
  - id: cost_of_goods_sold
    type: additive
    measure: posted_amount
    filters: [posting_only, primary_book_only, cogs_accounts]
  - id: operating_expenses
    type: additive
    measure: posted_amount
    filters: [posting_only, primary_book_only, expense_accounts]
  - id: gross_profit
    type: derived
    operator: subtract
    operands: [revenue, cost_of_goods_sold]
  - id: net_ordinary_income
    type: derived
    operator: subtract
    operands: [gross_profit, operating_expenses]
  - id: gross_margin_pct
    type: ratio
    numerator: gross_profit
    denominator: revenue
  - id: revenue_period_to_date
    type: period_to_date
    measure: posted_amount
    filters: [posting_only, primary_book_only, income_accounts]
dimensions: [account, period, subsidiary, department, class, location, {slot: custom_segments}]
